name: Build and Deploy to BTP Cloud Foundry test

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

env:
  CF_API: ${{ secrets.CF_API }}           # e.g. https://api.cf.eu10.hana.ondemand.com
  CF_ORG: ${{ secrets.CF_ORG }}
  CF_SPACE: ${{ secrets.CF_SPACE }}
  CF_USERNAME: ${{ secrets.CF_USERNAME }}
  CF_PASSWORD: ${{ secrets.CF_PASSWORD }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install MTA Build Tool (mbt)
        run: npm install -g mbt

      - name: Install root dependencies
        run: npm install

      - name: Build MTA archive
        run: mbt build

      - name: Install Cloud Foundry CLI
        run: |
          curl -L "https://packages.cloudfoundry.org/stable?release=linux64-binary&version=v8&source=github" | tar -zx
          sudo mv cf8 /usr/local/bin/cf
          cf --version

      - name: Login to Cloud Foundry
        run: |
          cf api "$CF_API"
          cf auth "$CF_USERNAME" "$CF_PASSWORD"
          cf target -o "$CF_ORG" -s "$CF_SPACE"

      - name: Install multiapps deploy plugin
        run: cf install-plugin -f multiapps

      - name: Deploy MTA to Cloud Foundry
        run: cf deploy mta_archives/*.mtar -f

      - name: Show deployed apps
        run: cf apps