name: CI/CD - Build & Deploy MTA to Cloud Foundry

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install MTA Build Tool
        run: npm install -g mbt

      - name: Install Cloud Foundry CLI
        run: |
          curl -L "https://packages.cloudfoundry.org/stable?release=linux64-binary&version=v8&source=github" | tar -zx
          sudo mv cf8 /usr/local/bin/cf
          cf --version

      - name: Install multiapps CF plugin
        run: |
          cf install-plugin -f https://github.com/cloudfoundry/multiapps-cli-plugin/releases/latest/download/multiapps-plugin.linux64

      - name: Build MTA archive
        run: mbt build

      - name: CF Login
        run: |
          cf api https://api.cf.us10-003.hana.ondemand.com
          cf auth "${{ secrets.CF_USERNAME }}" "${{ secrets.CF_PASSWORD }}"
          cf target -o edaa77a3trial -s dev

      - name: Deploy MTAR to Cloud Foundry
        run: |
          MTAR_FILE=$(ls mta_archives/*.mtar | head -n 1)
          cf deploy "$MTAR_FILE" -f