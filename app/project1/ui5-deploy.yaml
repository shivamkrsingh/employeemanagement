specVersion: "4.0"

metadata:
  name: app.spec.project1

type: application

builder:
  resources:
    excludes:
      - "/test/**"
      - "/localService/**"

  customTasks:
    - name: ui5-task-zipper
      afterTask: generateCachebusterInfo
      configuration:
        archiveName: appspecproject1
        relativePaths: true
        additionalFiles:
          - xs-app.json

resources:
  configuration:
    propertiesFileSourceEncoding: UTF-8