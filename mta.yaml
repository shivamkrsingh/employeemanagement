_schema-version: "3.3.0"
ID: employee-management
description: Employee Management CAP Project
version: 1.0.0

################################################################
# GLOBAL PARAMETERS
################################################################
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true

################################################################
# GLOBAL BUILD
################################################################
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm install
        - npx cds build --production

################################################################
# MODULES
################################################################
modules:

  # 1. HANA DATABASE DEPLOYER
  - name: employee-management-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: employee-management-db

  # 2. CAP SERVICE
  - name: employee-management-srv
    type: nodejs
    path: gen/srv
    parameters:
      memory: 512M
      disk-quota: 512M
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: employee-management-auth
      - name: employee-management-db

  # 3. UI5 APPLICATION MODULE
  - name: appspecproject1
    type: html5
    path: app/project1
    build-parameters:
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      build-result: dist
      supported-platforms: []

  # 4. HTML5 CONTENT DEPLOYER
  - name: employee-management-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: employee-management-html5-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - name: appspecproject1
          artifacts:
            - "*.zip"
          target-path: resources/

  # 5. APPLICATION ROUTER
  - name: employee-management
    type: approuter.nodejs
    path: app/router
    parameters:
      memory: 256M
      disk-quota: 256M
      keep-existing-routes: true
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}
    requires:
      - name: employee-management-auth
      - name: employee-management-html5-runtime
      - name: employee-management-destination-service
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true

################################################################
# RESOURCES
################################################################
resources:

  # HANA HDI CONTAINER
  - name: employee-management-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  # XSUAA AUTHENTICATION
  - name: employee-management-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: xs-security.json
      config:
        xsappname: employee-management-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          redirect-uris:
            - https://*~{app-api/app-uri}/**
    requires:
      - name: app-api

  # DESTINATION SERVICE
  - name: employee-management-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        version: 1.0.0
        init_data:
          instance:
            existing_destinations_policy: update
            destinations:
              - Name: ui5
                URL: https://ui5.sap.com
                ProxyType: Internet
                Type: HTTP
                Authentication: NoAuthentication

  # HTML5 HOST
  - name: employee-management-html5-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  # HTML5 RUNTIME
  - name: employee-management-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime