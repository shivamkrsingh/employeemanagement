_schema-version: "3.3.0"

ID: employee-management
description: Employee Management CAP Project
version: 1.0.0

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm install
        - npx cds build --production

modules:

  # ============================================================
  # 1. HANA DATABASE DEPLOYER
  # ============================================================

  - name: employee-management-db-deployer
    type: hdb
    path: gen/db

    parameters:
      buildpack: nodejs_buildpack

    requires:
      - name: employee-management-db


  # ============================================================
  # 2. CAP SERVICE
  # ============================================================

  - name: employee-management-srv
    type: nodejs
    path: gen/srv

    parameters:
      memory: 512M
      disk-quota: 512M
      buildpack: nodejs_buildpack

    build-parameters:
      builder: npm-ci

    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

    requires:
      - name: employee-management-auth
      - name: employee-management-db


# ================================================================
# RESOURCES
# ================================================================

resources:

  # ============================================================
  # 1. HANA HDI CONTAINER
  # ============================================================

  - name: employee-management-db
    type: com.sap.xs.hdi-container

    parameters:
      service: hana
      service-plan: hdi-shared


  # ============================================================
  # 2. XSUAA
  # ============================================================

  - name: employee-management-auth
    type: org.cloudfoundry.managed-service

    parameters:
      service: xsuaa
      service-plan: application
      path: xs-security.json

      config:
        xsappname: employee-management-${org}-${space}
        tenant-mode: dedicated